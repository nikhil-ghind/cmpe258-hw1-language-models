# HW1 part 1: loss of an (essentially) untrained model, for 3 tokenizers. train.max_steps=1 at warmup LR.
name: hw1_untrained
base: ../../../repo/DeepDataMiningLearning/llm/nanolm/configs/02_char_transformer.yaml
seeds: [1337, 42]
common:
  train.max_steps: 1
  model.norm: rmsnorm
  model.pos: rope
  model.mlp: swiglu
  model.bias: false
runs:
  - name: char
    overrides: {data.tokenizer: char}
  - name: byte
    overrides: {data.tokenizer: byte}
  - name: gpt2
    overrides: {data.tokenizer: gpt2}
