# HW1 part 2 control: is the vanilla RNN's deficit a capacity / LR artifact? Same budget as sweeps/01_char_models.yaml.
name: hw1_rnn_controls
base: ../../../repo/DeepDataMiningLearning/llm/nanolm/configs/02_char_transformer.yaml
seeds: [1337, 42]
common:
  train.max_steps: 2000
  train.seq_len: 256
  train.batch_size: 32
  train.weight_decay: 0.0
  model.arch: rnn
  model.n_layers: 2
runs:
  - name: rnn_512_paramsmatch    # ~same parameter count as LSTM 2x256
    overrides: {model.dim: 512, train.lr: 2e-3}
  - name: rnn_lr4e-3
    overrides: {model.dim: 256, train.lr: 4e-3}
  - name: rnn_lr1e-3
    overrides: {model.dim: 256, train.lr: 1e-3}
  - name: rnn_lr5e-4
    overrides: {model.dim: 256, train.lr: 5e-4}
