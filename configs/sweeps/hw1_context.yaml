# HW1 part 3: context length. Every run sees the same 16.384M tokens in the same 2000 optimizer steps
# (batch_size x seq_len = 8192), so the LR schedule is identical and only the window length changes.
name: hw1_context
base: ../../../repo/DeepDataMiningLearning/llm/nanolm/configs/02_char_transformer.yaml
seeds: [1337, 42, 7]
common:
  train.max_steps: 2000
runs:
  - name: lstm_T64
    overrides: {model.arch: lstm, model.n_layers: 2, model.dim: 256, train.lr: 2e-3, train.weight_decay: 0.0, train.seq_len: 64, train.batch_size: 128}
  - name: lstm_T128
    overrides: {model.arch: lstm, model.n_layers: 2, model.dim: 256, train.lr: 2e-3, train.weight_decay: 0.0, train.seq_len: 128, train.batch_size: 64}
  - name: lstm_T256
    overrides: {model.arch: lstm, model.n_layers: 2, model.dim: 256, train.lr: 2e-3, train.weight_decay: 0.0, train.seq_len: 256, train.batch_size: 32}
  - name: lstm_T512
    overrides: {model.arch: lstm, model.n_layers: 2, model.dim: 256, train.lr: 2e-3, train.weight_decay: 0.0, train.seq_len: 512, train.batch_size: 16}
  - name: gpt_T64
    overrides: {model.norm: rmsnorm, model.pos: rope, model.mlp: swiglu, model.bias: false, train.seq_len: 64, train.batch_size: 128}
  - name: gpt_T128
    overrides: {model.norm: rmsnorm, model.pos: rope, model.mlp: swiglu, model.bias: false, train.seq_len: 128, train.batch_size: 64}
  - name: gpt_T256
    overrides: {model.norm: rmsnorm, model.pos: rope, model.mlp: swiglu, model.bias: false, train.seq_len: 256, train.batch_size: 32}
  - name: gpt_T512
    overrides: {model.norm: rmsnorm, model.pos: rope, model.mlp: swiglu, model.bias: false, train.seq_len: 512, train.batch_size: 16}
